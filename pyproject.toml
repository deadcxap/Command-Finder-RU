[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "command-finder-ru"
version = "1.1.0rc2"
description = "Локальный поиск консольных команд по описанию задачи на русском языке"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["cli", "semantic-search", "russian", "onnx", "sqlite-vec"]
dependencies = [
    "sqlite-vec>=0.1.9",
    "typer>=0.12",
    "simple-term-menu>=1.6",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "onnx>=1.16",
]
export = [
    "torch==2.6.0",
    "sentence-transformers==4.0.2",
    "transformers==4.49.0",
    "onnx>=1.16",
]
benchmark = [
    "torch==2.6.0",
    "sentence-transformers==4.0.2",
    "transformers==4.49.0",
    "onnx>=1.16",
]

[project.scripts]
cf = "cf.cli:app"

[project.urls]
Repository = "https://github.com/deadcxap/Command-Finder-RU"
Issues = "https://github.com/deadcxap/Command-Finder-RU/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cf = ["data/commands/*.json", "data/model.json", "data/cf.bash"]
