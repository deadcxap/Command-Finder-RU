[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cf"
version = "0.1.0"
description = "Find bash commands using natural language"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "sqlite-vec>=0.1.9",
    "typer>=0.12",
    "simple-term-menu>=1.6",
    "numpy>=1.26",
    "onnxruntime>=1.17",
    "tokenizers>=0.21,<0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "onnx>=1.16",
]
export = [
    "torch==2.6.0",
    "sentence-transformers==4.0.2",
    "transformers==4.49.0",
    "onnx>=1.16",
]
benchmark = [
    "torch==2.6.0",
    "sentence-transformers==4.0.2",
    "transformers==4.49.0",
    "onnx>=1.16",
]

[project.scripts]
cf = "cf.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cf = ["data/commands/*.json", "data/model.json", "data/cf.bash"]
