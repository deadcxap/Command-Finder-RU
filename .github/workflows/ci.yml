name: Проверки

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      CF_DB_DIR: ${{ runner.temp }}/cf-ru-tests
    steps:
      - name: Получить исходники
        uses: actions/checkout@v7
      - name: Установить Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Установить зависимости разработки
        run: python -m pip install -e '.[dev]' build
      - name: Проверить зависимости
        run: python -m pip check
      - name: Проверить синтаксис установщиков
        run: bash -n install.sh uninstall.sh shell/cf.bash src/cf/data/cf.bash
      - name: Запустить тесты без загрузки весов
        run: python -m pytest
      - name: Собрать пакет
        run: python -m build
